<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-Orchestrator Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #10b981;
      --running: #f59e0b;
      --failed: #ef4444;
      --lost: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.07) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 56px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.825rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
    }

    .container {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      min-width: 420px;
    }

    .panel-header {
      height: 44px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .editor-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .right-panel {
      flex: 1.3;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .jobs-summary {
      flex-shrink: 0;
      max-height: 220px;
    }

    .runs-history {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .table-container {
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #111827;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-border);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-failed { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-timeout { background: rgba(217, 119, 6, 0.15); color: #fba124; border: 1px solid rgba(217, 119, 6, 0.3); }
    .badge-lost { background: rgba(107, 114, 128, 0.15); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.3); }
    .badge-running {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      animation: pulse 1.8s infinite;
    }
    .badge-starting {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .code-pill {
      font-family: 'Fira Code', monospace;
      font-size: 0.72rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .toast-success { background: #065f46; color: #a7f3d0; border: 1px solid #059669; }
    .toast-error { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .modal {
      width: 800px;
      max-width: 95vw;
      height: 600px;
      max-height: 90vh;
      background: #0d1117;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    .modal-header {
      padding: 12px 18px;
      background: #161b22;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .modal-body {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      background: #090d13;
      font-family: 'Fira Code', monospace;
      font-size: 0.78rem;
      color: #38bdf8;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--text-main); }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡ Micro-Orchestrator</span>
      <span class="brand-badge">Zero-Daemon</span>
    </div>
    <div class="header-actions">
      <span id="sync-indicator" style="font-size: 0.75rem; color: var(--text-muted);">● Auto-syncing</span>
      <button class="btn btn-secondary" id="refresh-btn">↻ Refresh Now</button>
    </div>
  </header>

  <div class="container">
    <div class="left-panel">
      <div class="panel-header">
        <span>📄 jobs.yaml Config</span>
        <button id="save-btn" class="btn btn-primary btn-sm">💾 Save Changes</button>
      </div>
      <div id="monaco-editor" class="editor-container"></div>
    </div>

    <div class="right-panel">
      <div class="section-card jobs-summary">
        <div class="panel-header">
          <span>⚙️ Configured Jobs</span>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Job Name</th>
                <th>Cron Schedule</th>
                <th>Concurrency</th>
                <th>Latest Run</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="jobs-table-body">
              <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading jobs...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="section-card runs-history">
        <div class="panel-header">
          <span>📜 Execution History (Latest 50 Runs)</span>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Run ID</th>
                <th>Job Name</th>
                <th>Trigger</th>
                <th>Status</th>
                <th>Start Time</th>
                <th>Duration</th>
                <th>Exit</th>
                <th>Log</th>
              </tr>
            </thead>
            <tbody id="runs-table-body">
              <tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Loading history...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="log-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span id="log-modal-title">📄 Log Content</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn btn-secondary btn-sm" id="reload-log-btn">↻ Reload</button>
          <button class="close-btn" id="close-modal-btn">&times;</button>
        </div>
      </div>
      <div id="log-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let editor = null;
    let currentLogRunId = null;

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monaco.editor.defineTheme('customDark', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#0f172a',
          'editorLineNumber.foreground': '#475569',
          'editorLineNumber.activeForeground': '#38bdf8',
          'editor.lineHighlightBackground': '#1e293b44'
        }
      });

      editor = monaco.editor.create(document.getElementById('monaco-editor'), {
        value: '# Loading jobs.yaml...',
        language: 'yaml',
        theme: 'customDark',
        fontSize: 13,
        minimap: { enabled: false },
        automaticLayout: true,
        scrollBeyondLastLine: false,
        padding: { top: 12, bottom: 12 }
      });

      loadConfig();
    });

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = isError ? 'toast-error' : 'toast-success';
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (editor) { editor.setValue(data.content || ''); }
      } catch (err) {
        showToast('Failed to load jobs.yaml: ' + err.message, true);
      }
    }

    async function saveConfig() {
      if (!editor) return;
      const content = editor.getValue();
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const result = await res.json();
        if (!res.ok) {
          showToast(result.detail || 'Failed to save configuration', true);
        } else {
          showToast('Configuration validated & saved successfully!');
          loadJobs();
        }
      } catch (err) {
        showToast('Network error while saving: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Save Changes';
      }
    }

    function getBadgeClass(status) {
      switch (status) {
        case 'SUCCESS': return 'badge-success';
        case 'FAILED': return 'badge-failed';
        case 'TIMEOUT': return 'badge-timeout';
        case 'RUNNING': return 'badge-running';
        case 'STARTING': return 'badge-starting';
        case 'LOST': return 'badge-lost';
        default: return 'badge-lost';
      }
    }

    async function loadJobs() {
      try {
        const res = await fetch('/api/jobs');
        const data = await res.json();
        const tbody = document.getElementById('jobs-table-body');
        tbody.innerHTML = '';

        if (!data.jobs || data.jobs.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5" style="text-align: center; color: var(--text-muted);">No jobs configured.</td>';
          tbody.appendChild(tr);
          return;
        }

        data.jobs.forEach(j => {
          const tr = document.createElement('tr');

          const tdName = document.createElement('td');
          const strong = document.createElement('strong');
          strong.textContent = j.name;
          tdName.appendChild(strong);

          const tdSchedule = document.createElement('td');
          const pill = document.createElement('span');
          pill.className = 'code-pill';
          pill.textContent = j.schedule || '';
          tdSchedule.appendChild(pill);

          const tdConc = document.createElement('td');
          tdConc.style.fontSize = '0.75rem';
          tdConc.style.color = 'var(--text-muted)';
          tdConc.textContent = j.concurrency || 'allow';

          const tdLatest = document.createElement('td');
          if (j.latest_run) {
            const st = j.latest_run.status;
            const badge = document.createElement('span');
            badge.className = `badge ${getBadgeClass(st)}`;
            badge.textContent = st;
            tdLatest.appendChild(badge);
          } else {
            tdLatest.innerHTML = '<span style="color: var(--text-muted); font-size: 0.75rem;">Never run</span>';
          }

          const tdActions = document.createElement('td');
          const btnRun = document.createElement('button');
          btnRun.className = 'btn btn-secondary btn-sm';
          btnRun.textContent = '▶ Run Now';
          btnRun.addEventListener('click', () => triggerJob(j.name));
          tdActions.appendChild(btnRun);

          tr.appendChild(tdName);
          tr.appendChild(tdSchedule);
          tr.appendChild(tdConc);
          tr.appendChild(tdLatest);
          tr.appendChild(tdActions);

          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Failed to load jobs:', err);
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status?limit=50');
        const data = await res.json();
        const tbody = document.getElementById('runs-table-body');
        tbody.innerHTML = '';

        if (!data.runs || data.runs.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="8" style="text-align: center; color: var(--text-muted);">No execution history recorded yet.</td>';
          tbody.appendChild(tr);
          return;
        }

        data.runs.forEach(r => {
          const tr = document.createElement('tr');

          const tdId = document.createElement('td');
          tdId.style.color = 'var(--text-muted)';
          tdId.style.fontSize = '0.72rem';
          tdId.textContent = (r.run_id || '').substring(0, 8);
          tdId.title = r.run_id || '';

          const tdName = document.createElement('td');
          const strong = document.createElement('strong');
          strong.textContent = r.job_name;
          tdName.appendChild(strong);

          const tdTrigger = document.createElement('td');
          tdTrigger.style.fontSize = '0.72rem';
          tdTrigger.style.color = 'var(--text-muted)';
          tdTrigger.textContent = r.trigger_type || 'scheduled';

          const tdStatus = document.createElement('td');
          const badge = document.createElement('span');
          badge.className = `badge ${getBadgeClass(r.status)}`;
          badge.textContent = r.status;
          tdStatus.appendChild(badge);

          const tdStart = document.createElement('td');
          tdStart.style.fontSize = '0.75rem';
          tdStart.style.color = 'var(--text-muted)';
          tdStart.textContent = r.start_time || '';

          const tdDur = document.createElement('td');
          tdDur.textContent = r.duration_sec !== null ? `${r.duration_sec}s` : (r.status === 'RUNNING' ? 'Running...' : '-');

          const tdExit = document.createElement('td');
          if (r.exit_code !== null) {
            const pill = document.createElement('span');
            pill.className = 'code-pill';
            pill.textContent = r.exit_code;
            tdExit.appendChild(pill);
          } else {
            tdExit.textContent = '-';
          }

          const tdLog = document.createElement('td');
          if (r.run_id) {
            const btnLog = document.createElement('button');
            btnLog.className = 'btn btn-secondary btn-sm';
            btnLog.textContent = '🔍 View Log';
            btnLog.addEventListener('click', () => viewLog(r.run_id));
            tdLog.appendChild(btnLog);
          } else {
            tdLog.textContent = '-';
          }

          tr.appendChild(tdId);
          tr.appendChild(tdName);
          tr.appendChild(tdTrigger);
          tr.appendChild(tdStatus);
          tr.appendChild(tdStart);
          tr.appendChild(tdDur);
          tr.appendChild(tdExit);
          tr.appendChild(tdLog);

          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Failed to load status:', err);
      }
    }

    async function triggerJob(jobName) {
      try {
        const res = await fetch(`/api/run/${encodeURIComponent(jobName)}`, { method: 'POST' });
        const result = await res.json();
        if (res.status === 202) {
          showToast(`Job '${jobName}' dispatched successfully!`);
          setTimeout(refreshAll, 300);
        } else if (res.status === 409) {
          showToast(`Cannot run: ${result.message}`, true);
        } else {
          showToast(result.detail || result.message || 'Failed to trigger job', true);
        }
      } catch (err) {
        showToast('Trigger error: ' + err.message, true);
      }
    }

    async function viewLog(runId) {
      currentLogRunId = runId;
      document.getElementById('log-modal-title').textContent = `📄 Log for Run ID: ${runId}`;
      document.getElementById('log-modal').style.display = 'flex';
      reloadCurrentLog();
    }

    async function reloadCurrentLog() {
      if (!currentLogRunId) return;
      const body = document.getElementById('log-modal-body');
      try {
        const res = await fetch(`/api/runs/${encodeURIComponent(currentLogRunId)}/logs?lines=300`);
        const data = await res.json();
        if (res.ok) {
          body.textContent = data.content || '(Log file is currently empty)';
          body.scrollTop = body.scrollHeight;
        } else {
          body.textContent = 'Error: ' + (data.detail || 'Could not load log');
        }
      } catch (err) {
        body.textContent = 'Error fetching log: ' + err.message;
      }
    }

    function closeLogModal() {
      document.getElementById('log-modal').style.display = 'none';
      currentLogRunId = null;
    }

    function refreshAll() {
      loadJobs();
      loadStatus();
    }

    document.getElementById('save-btn').addEventListener('click', saveConfig);
    document.getElementById('refresh-btn').addEventListener('click', refreshAll);
    document.getElementById('reload-log-btn').addEventListener('click', reloadCurrentLog);
    document.getElementById('close-modal-btn').addEventListener('click', closeLogModal);

    setInterval(() => {
      loadJobs();
      loadStatus();
      if (currentLogRunId) {
        reloadCurrentLog();
      }
    }, 3500);

    refreshAll();
  </script>
</body>
</html>
